<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0c0c; color:#f0f0f0; font-family:'Sarabun','Noto Sans Thai',sans-serif; }
  ::-webkit-scrollbar { display:none; }
  input, button, textarea { font-family:'Sarabun','Noto Sans Thai',sans-serif; }
  .drop-zone { border:2px dashed #333; border-radius:10px; padding:18px; text-align:center; cursor:pointer; color:#555; font-size:13px; transition:border-color 0.2s; }
  .drop-zone:hover { border-color:#666; color:#888; }
  .drop-zone.dragover { border-color:#aaa; color:#ccc; }
  .tab-grid { display:grid; grid-template-columns:repeat(8,1fr); width:100%; }
  .tab-btn { background:none; border:none; border-bottom:2px solid transparent; padding:8px 2px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; min-width:0; }
  .tab-btn span.emoji { font-size:18px; }
  .tab-btn span.label { font-size:9px; font-weight:400; line-height:1.2; text-align:center; word-break:break-word; width:100%; }
  .tab-btn.active span.label { font-weight:700; }
  .tab-btn span.count { border-radius:8px; padding:0 5px; font-size:9px; font-weight:700; }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 999;
    padding: 0;
  }
  .modal-sheet {
    background: #161616;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 16px;
    padding-bottom: 32px;
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(60px); opacity:0; }
    to   { transform: translateY(0);    opacity:1; }
  }
  .modal-drag-bar {
    width: 40px; height: 4px;
    background: #333; border-radius: 2px;
    margin: 0 auto 14px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const CATEGORIES = [
  { id:"movies",   label:"หนัง",           emoji:"🎬", color:"#FFFFFF" },
  { id:"anime",    label:"อนิเมะ",          emoji:"⛩️", color:"#FFFFFF" },
  { id:"books",    label:"หนังสือ/มังงะ",  emoji:"📓", color:"#FFFFFF" },
  { id:"music",    label:"เพลง/ศิลปิน",    emoji:"𝄞",  color:"#FFFFFF" },
  { id:"hobby",    label:"งานอดิเรก",       emoji:"🎮", color:"#FFFFFF" },
  { id:"sport",    label:"กีฬา",            emoji:"💪🏻", color:"#FFFFFF" },
  { id:"places",   label:"อยากไป",          emoji:"✈",  color:"#FFFFFF" },
  { id:"visited",  label:"ที่เคยไป",        emoji:"💭", color:"#FFFFFF" },
  { id:"food",     label:"อาหาร",           emoji:"🍽️", color:"#FFFFFF" },
  { id:"bakery",   label:"ขนม/เบเกอรี่",   emoji:"🍰", color:"#FFFFFF" },
  { id:"drinks",   label:"เครื่องดื่ม",     emoji:"☕︎", color:"#FFFFFF" },
  { id:"cafe",     label:"ร้านโปรด",        emoji:"𖠿", color:"#FFFFFF" },
  { id:"podcast",  label:"Podcast/YouTube", emoji:"🎙️", color:"#FFFFFF" },
  { id:"outfits",  label:"ชุด/สไตล์",       emoji:"✄",  color:"#FFFFFF" },
  { id:"wishlist", label:"Wishlist",         emoji:"🛒", color:"#FFFFFF" },
  { id:"learn",    label:"อยากเรียนรู้",    emoji:"🗒",  color:"#FFFFFF" },
];

const INIT = Object.fromEntries(CATEGORIES.map(c => [c.id, []]));
const RATINGS = ["★★★★★","★★★★☆","★★★☆☆","★★☆☆☆","★☆☆☆☆"];
const STORAGE_KEY = "my-data-v3";
const ROW1 = CATEGORIES.slice(0, 8);
const ROW2 = CATEGORIES.slice(8, 16);

function App() {
  const [data,     setData]     = React.useState(() => { try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : INIT; } catch { return INIT; } });
  const [active,   setActive]   = React.useState("movies");
  const [input,    setInput]    = React.useState("");
  const [note,     setNote]     = React.useState("");
  const [rating,   setRating]   = React.useState("★★★★★");
  const [imgData,  setImgData]  = React.useState("");
  const [imgUrl,   setImgUrl]   = React.useState("");
  const [editId,   setEditId]   = React.useState(null);
  const [search,   setSearch]   = React.useState("");
  const [dragOver, setDragOver] = React.useState(false);
  const [modalItem, setModalItem] = React.useState(null);
  const fileRef = React.useRef();

  React.useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} }, [data]);

  const cat         = CATEGORIES.find(c => c.id === active);
  const totalItems  = Object.values(data).reduce((a, b) => a + b.length, 0);
  const resolvedImg = imgData || imgUrl || "";

  const handleFile = file => {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = e => { setImgData(e.target.result); setImgUrl(""); };
    reader.readAsDataURL(file);
  };

  const resetForm  = () => { setInput(""); setNote(""); setRating("★★★★★"); setImgData(""); setImgUrl(""); };
  const cancelEdit = () => { setEditId(null); resetForm(); };
  const switchTab  = id => { setActive(id); setSearch(""); cancelEdit(); };

  const addItem = () => {
    if (!input.trim()) return;
    const img = resolvedImg;
    if (editId !== null) {
      setData(d => ({ ...d, [active]: d[active].map(item => item.id === editId ? { ...item, name:input, note, rating, img } : item) }));
      setEditId(null);
    } else {
      setData(d => ({ ...d, [active]: [...d[active], { id:Date.now(), name:input, note, rating, img, added:new Date().toLocaleDateString("th-TH") }] }));
    }
    resetForm();
  };

  const deleteItem = id => {
    setData(d => ({ ...d, [active]: d[active].filter(i => i.id !== id) }));
    setModalItem(null);
  };

  const startEdit = item => {
    setModalItem(null);
    setEditId(item.id); setInput(item.name); setNote(item.note||""); setRating(item.rating||"★★★★★");
    setImgData(item.img && item.img.startsWith("data:") ? item.img : "");
    setImgUrl (item.img && !item.img.startsWith("data:") ? item.img : "");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const filtered = data[active].filter(i => i.name.toLowerCase().includes(search.toLowerCase()));

  const iS  = { width:"100%", background:"#1f1f1f", border:"1px solid #2a2a2a", borderRadius:10, padding:"10px 14px", color:"#fff", fontSize:15, outline:"none", display:"block" };
  const iBt = { background:"none", border:"1px solid #2a2a2a", borderRadius:7, color:"#444", width:30, height:30, cursor:"pointer", fontSize:13 };

  const TabRow = ({ cats }) => (
    <div className="tab-grid">
      {cats.map(c => {
        const isActive = active === c.id;
        return (
          <button key={c.id} className={`tab-btn${isActive ? " active" : ""}`} onClick={() => switchTab(c.id)}
            style={{ borderBottom: isActive ? `2px solid ${c.color}` : "2px solid transparent", color: isActive ? c.color : "#484848" }}>
            <span className="emoji">{c.emoji}</span>
            <span className="label">{c.label}</span>
            {data[c.id].length > 0 && (
              <span className="count" style={{ background:isActive?c.color:"#222", color:isActive?"#000":"#555" }}>{data[c.id].length}</span>
            )}
          </button>
        );
      })}
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"#0c0c0c", display:"flex", flexDirection:"column" }}>

      {/* Header */}
      <div style={{ background:"#111", borderBottom:"1px solid #1e1e1e", padding:"20px 16px 0" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:4, color:"#444", textTransform:"uppercase", marginBottom:3 }}>PERSONAL COLLECTION</div>
            <div style={{ fontSize:28, fontWeight:800, color:"#fff", lineHeight:1 }}>My</div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:28, fontWeight:900, color:cat.color, lineHeight:1 }}>{totalItems}</div>
            <div style={{ fontSize:10, color:"#444", letterSpacing:1 }}>รายการทั้งหมด</div>
          </div>
        </div>
        <TabRow cats={ROW1} />
        <div style={{ borderTop:"1px solid #1a1a1a" }} />
        <TabRow cats={ROW2} />
      </div>

      {/* Body */}
      <div style={{ flex:1, padding:"18px 16px", maxWidth:600, width:"100%", margin:"0 auto" }}>

        {/* Input card */}
        <div style={{ background:"#161616", border:`1px solid ${cat.color}22`, borderRadius:16, padding:16, marginBottom:18 }}>
          <div style={{ fontSize:11, color:cat.color, marginBottom:10, fontWeight:700, letterSpacing:1 }}>
            {cat.emoji} {editId ? "แก้ไขรายการ" : `เพิ่ม${cat.label}`}
          </div>

          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addItem()}
            placeholder={`ชื่อ / ${cat.label}...`} style={iS} />
          <input value={note} onChange={e => setNote(e.target.value)}
            placeholder="โน้ต หรือเหตุผลที่ชอบ (ไม่บังคับ)"
            style={{ ...iS, color:"#888", fontSize:13, marginTop:6 }} />

          {/* Image section */}
          <div style={{ marginTop:10, display:"flex", gap:8, flexDirection:"column" }}>
            <div style={{ fontSize:11, color:"#555", fontWeight:600 }}>📷 รูปภาพ (ไม่บังคับ)</div>
            <div style={{ display:"flex", gap:8 }}>
              <input value={imgUrl} onChange={e => { setImgUrl(e.target.value); setImgData(""); }}
                placeholder="วางลิงก์รูป (URL)..."
                style={{ ...iS, fontSize:12, color:"#888", flex:1 }} />
              <button onClick={() => fileRef.current.click()} style={{
                flexShrink:0, background:"#1f1f1f", border:"1px solid #2a2a2a", borderRadius:10,
                color:"#888", padding:"0 14px", cursor:"pointer", fontSize:12, whiteSpace:"nowrap",
              }}>📁 อัปโหลด</button>
              <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }}
                onChange={e => handleFile(e.target.files[0])} />
            </div>
            <div
              className={`drop-zone${dragOver ? " dragover" : ""}`}
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
              onClick={() => fileRef.current.click()}
            >
              {resolvedImg ? "✔ มีรูปแล้ว — คลิกหรือลากเพื่อเปลี่ยน" : "ลากรูปมาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์"}
            </div>
            {resolvedImg && (
              <div style={{ position:"relative" }}>
                <img src={resolvedImg} alt="preview" onError={() => setImgUrl("")}
                  style={{ width:"50%", aspectRatio:"3/4", objectFit:"cover", borderRadius:10, border:"1px solid #2a2a2a", display:"block" }} />
                <button onClick={() => { setImgData(""); setImgUrl(""); }} style={{
                  position:"absolute", top:6, left:"calc(50% - 30px)", background:"#000000cc", border:"none",
                  borderRadius:6, color:"#fff", width:24, height:24, cursor:"pointer", fontSize:12,
                }}>✕</button>
              </div>
            )}
          </div>

          <div style={{ display:"flex", gap:5, marginTop:12, flexWrap:"wrap", alignItems:"center" }}>
            {RATINGS.map(r => (
              <button key={r} onClick={() => setRating(r)} style={{
                background: rating===r ? cat.color+"22" : "#1f1f1f",
                border: `1px solid ${rating===r ? cat.color : "#2a2a2a"}`,
                borderRadius:7, color: rating===r ? cat.color : "#555",
                padding:"3px 9px", fontSize:11, cursor:"pointer",
              }}>{r}</button>
            ))}
            <div style={{ flex:1 }} />
            {editId && <button onClick={cancelEdit} style={{ background:"none", border:"1px solid #333", borderRadius:8, color:"#666", padding:"7px 12px", cursor:"pointer", fontSize:12 }}>ยกเลิก</button>}
            <button onClick={addItem} disabled={!input.trim()} style={{
              background: input.trim() ? cat.color : "#222",
              color: input.trim() ? "#000" : "#444",
              border:"none", borderRadius:10, padding:"8px 20px", fontSize:14, fontWeight:700,
              cursor: input.trim() ? "pointer" : "not-allowed",
            }}>{editId ? "บันทึก" : "เพิ่ม"}</button>
          </div>
        </div>

        {/* Search */}
        {data[active].length > 3 && (
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder={`🔍 ค้นหาใน${cat.label}...`}
            style={{ ...iS, marginBottom:12, color:"#888", fontSize:13 }} />
        )}

        {/* List */}
        {filtered.length === 0 ? (
          <div style={{ textAlign:"center", padding:"48px 0", color:"#2e2e2e" }}>
            <div style={{ fontSize:44, marginBottom:10 }}>{cat.emoji}</div>
            <div style={{ fontSize:13 }}>{data[active].length === 0 ? `เพิ่ม${cat.label}แรกเลย!` : "ไม่พบรายการ"}</div>
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {filtered.map((item, idx) => (
              <div key={item.id} style={{
                background:"#141414", border:"1px solid #1e1e1e",
                borderLeft:`3px solid ${cat.color}`, borderRadius:12,
                overflow:"hidden",
              }}>
                <div style={{ padding:"12px 14px", display:"flex", alignItems:"flex-start", gap:12 }}>
                  <div style={{ width:26, height:26, borderRadius:7, background:cat.color+"18", color:cat.color, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:800, flexShrink:0 }}>{idx+1}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    {/* กดชื่อเพื่อดูรูป */}
                    <div
                      onClick={() => item.img ? setModalItem(item) : null}
                      style={{
                        fontWeight:600, fontSize:15, color:"#eee", marginBottom:2,
                        cursor: item.img ? "pointer" : "default",
                        display:"flex", alignItems:"center", gap:6,
                      }}
                    >
                      {item.name}
                      {item.img && <span style={{ fontSize:10, color:cat.color+"88", fontWeight:400 }}>📷</span>}
                    </div>
                    {item.note && <div style={{ fontSize:12, color:"#555", marginBottom:3 }}>{item.note}</div>}
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                      <span style={{ fontSize:12, color:cat.color+"cc" }}>{item.rating}</span>
                      <span style={{ fontSize:11, color:"#383838" }}>{item.added}</span>
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:4, flexShrink:0 }}>
                    <button onClick={() => startEdit(item)} style={iBt}>✒️</button>
                    <button onClick={() => deleteItem(item.id)} style={iBt}>🗑</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Modal — bottom sheet */}
      {modalItem && (
        <div className="modal-overlay" onClick={() => setModalItem(null)}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="modal-drag-bar" onClick={() => setModalItem(null)} style={{ cursor:"pointer" }} />

            {/* Image 3:4, แสดงครึ่งนึง = width 50% of sheet */}
            <div style={{ display:"flex", justifyContent:"center", marginBottom:14 }}>
              <div style={{ width:"50%", position:"relative" }}>
                <img src={modalItem.img} alt={modalItem.name}
                  style={{ width:"100%", aspectRatio:"3/4", objectFit:"cover", borderRadius:12, display:"block" }} />
              </div>
            </div>

            {/* Info */}
            <div style={{ textAlign:"center", marginBottom:4 }}>
              <div style={{ fontWeight:700, fontSize:17, color:"#eee" }}>{modalItem.name}</div>
              {modalItem.note && <div style={{ fontSize:13, color:"#666", marginTop:4 }}>{modalItem.note}</div>}
              <div style={{ fontSize:13, color:cat.color+"cc", marginTop:6 }}>{modalItem.rating}</div>
            </div>

            {/* Actions */}
            <div style={{ display:"flex", gap:8, marginTop:14 }}>
              <button onClick={() => startEdit(modalItem)} style={{
                flex:1, background:"#1f1f1f", border:"1px solid #2a2a2a", borderRadius:10,
                color:"#aaa", padding:"10px", fontSize:13, cursor:"pointer",
              }}>✒️ แก้ไข</button>
              <button onClick={() => deleteItem(modalItem.id)} style={{
                flex:1, background:"#1f1f1f", border:"1px solid #2a2a2a", borderRadius:10,
                color:"#c04040", padding:"10px", fontSize:13, cursor:"pointer",
              }}>🗑 ลบ</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
